<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serbia 2026 Polling Stations</title>
<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
:root{--bg:#ffffff;--panel:#fbfbfa;--ink:#16202b;--muted:#5d6876;--rule:#e2e5e9;--accent:#c2410c;--blue:#1f5f99;--hl:#f97316;--soft:#f1f3f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 "Inter","Segoe UI",system-ui,-apple-system,sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(400px,1fr);height:100vh;gap:0}
#mapwrap{position:relative;min-height:0;border-right:1px solid var(--rule)}
#map{position:absolute;inset:0}
#panel{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
@media (max-width:1050px){#app{grid-template-columns:1fr;grid-template-rows:46vh minmax(0,1fr)}#mapwrap{border-right:0;border-bottom:1px solid var(--rule)}}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5;pointer-events:none}
.toolbar>*{pointer-events:auto}
.chip{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:5px 8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:6px;align-items:center}
select,input[type=text]{font:inherit;border:1px solid var(--rule);border-radius:6px;padding:4px 6px;background:#fff;color:var(--ink);max-width:260px}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 9px;font:inherit;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
#legend{position:absolute;left:10px;bottom:10px;z-index:5;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:6px 9px;min-width:190px;font-size:12px}
#legend .bar{height:9px;border-radius:3px;margin:4px 0}
#legend .lab{display:flex;justify-content:space-between;color:var(--muted)}
#card{position:absolute;right:10px;bottom:10px;z-index:6;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:300px;max-width:calc(100% - 20px);box-shadow:0 4px 14px rgba(0,0,0,.08);display:none;font-size:12.5px}
#card h4{margin:0 0 4px;font-size:13.5px}
#card .x{position:absolute;top:6px;right:9px;cursor:pointer;color:var(--muted)}
#card table{width:100%;border-collapse:collapse;margin-top:4px}
#card td{padding:2px 0;border-bottom:1px solid var(--soft)}
#card td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.banner{background:#fee2e2;color:#991b1b;font-weight:600;padding:4px 10px;border-radius:6px}
.tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap;background:#fff}
.tabs button{border:0;background:none;padding:8px 10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
#content{overflow:auto;padding:12px 16px 30px;min-height:0;flex:1}
h2{font-size:17px;margin:4px 0 8px}
h3{font-size:14px;margin:22px 0 6px;padding-top:12px;border-top:1px solid var(--rule)}
p{margin:6px 0}
.note{background:#eef4fb;border:1px solid #d6e4f3;border-radius:8px;padding:8px 10px;color:#22476b}
.cap{color:var(--muted);font-size:11.5px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.kpi{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:7px 9px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:11.5px}
.tbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.tblwrap{max-height:300px;overflow:auto;border:1px solid var(--rule);border-radius:8px}
.tbl th{position:sticky;top:0;background:#f6f7f8;text-align:left;font-weight:600;padding:5px 7px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer}
.tbl td{padding:4px 7px;border-bottom:1px solid var(--soft);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.row:hover{background:#fff4ec;cursor:pointer}
.tbl tr.grp td{background:#f6f7f8;font-weight:600}
.chart{width:100%;height:260px}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
a{color:var(--blue)}
#methodsLink{color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;margin-top:30px;display:inline-block}
#modal{position:fixed;inset:0;background:rgba(15,20,26,.45);display:none;z-index:50;align-items:center;justify-content:center}
#modal .box{background:#fff;max-width:760px;width:92%;max-height:86vh;overflow:auto;border-radius:12px;padding:18px 22px;font-size:13px}
#modal h3{border:0;margin-top:14px}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:11px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <div id="map"></div>
    <div class="toolbar" id="toolbar"></div>
    <div id="legend"></div>
    <div style="position:absolute;right:6px;bottom:2px;z-index:4;font-size:10px;color:#777;background:rgba(255,255,255,.7);padding:0 4px">Basemap © Esri, HERE, Garmin, © OpenStreetMap contributors</div>
    <div id="card"><span class="x" onclick="closeCard()">✕</span><div id="cardBody"></div></div>
  </div>
  <div id="panel">
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </div>
</div>
<div id="modal" onclick="if(event.target.id==='modal')this.style.display='none'"><div class="box" id="modalBox"></div></div>
<script>
const D = __DATA__;
const METHODS = __METHODS__;
const S = D.stations, N = S.id.length, L = D.lists;
const fmt = x => (x==null||isNaN(x)) ? "n/a" : Math.round(x).toLocaleString("en-US");
const pct = (x,d=1) => (x==null||isNaN(x)) ? "n/a" : (100*x).toFixed(d)+"%";
const sgn = (x,d=1,u="") => (x==null||isNaN(x)) ? "n/a" : (x>0?"+":x<0?"−":"")+(d===0?Math.abs(Math.round(x)).toLocaleString("en-US"):Math.abs(x).toFixed(d))+u;
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KIND = {domestic:"Serbia", kosovo:"Kosovo and Metohija", abroad:"Abroad", prison:"Prisons"};
const PREC = {building:"building", street:"street", settlement:"settlement", approx:"approximate", municipality:"municipality centre", city:"city centre"};

// ------------------------------------------------------------ derived per-station values
const VB = new Array(N), T = new Array(N), SH = L.map(()=>new Array(N)), CH23 = new Array(N), TCH = new Array(N);
for (let i=0;i<N;i++){
  T[i] = S.voted[i]!=null && S.reg[i]>0 ? S.voted[i]/S.reg[i] : null;
  const base = S.valid[i]!=null ? S.valid[i] : (L.length? L.reduce((a,_,k)=>a+(S.votes[k][i]||0),0):null);
  VB[i] = (S.voted[i]!=null && base>0) ? base : null;
  L.forEach((_,k)=>{ SH[k][i] = (S.votes[k][i]!=null && base>0) ? S.votes[k][i]/base : null; });
  CH23[i] = S.reg23[i] ? S.reg[i]/S.reg23[i]-1 : null;
  TCH[i] = (T[i]!=null && S.t23[i]!=null) ? (T[i]-S.t23[i])*100 : null;
}
const idxByLsg = {}; for (let i=0;i<N;i++){ if(S.lsg[i]) (idxByLsg[S.lsg[i]] ||= []).push(i); }
const idxByUnit = {}; for (let i=0;i<N;i++){ (idxByUnit[S.unit[i]] ||= []).push(i); }
const idIndex = {}; S.id.forEach((x,i)=>idIndex[x]=i);
const state = {tab:"forensics", view:"serbia", metric: D.has_results ? "turnout" : "reg", level:"stations", party:0,
               hl:new Set(), hlLsg:new Set(), hlKos:null, sel:null, ext: D.has_results ? "turnout" : "reg",
               scope:{domestic:true,kosovo:true,abroad:true,prison:true}};

// ------------------------------------------------------------ colours
const SEQ=[[239,243,255],[189,215,238],[107,174,214],[33,113,181],[8,48,107]];
const DIV=[[179,88,6],[241,163,64],[238,238,238],[153,142,195],[84,39,136]];
function ramp(v,lo,hi,stops){ if(v==null||isNaN(v)) return [200,200,200,120]; let x=Math.max(0,Math.min(1,(v-lo)/((hi-lo)||1)));
  const p=x*(stops.length-1), i=Math.min(Math.floor(p),stops.length-2), f=p-i; return stops[i].map((c,j)=>Math.round(c+(stops[i+1][j]-c)*f)); }
function quant(arr,q){ const a=arr.filter(v=>v!=null&&!isNaN(v)).sort((x,y)=>x-y); if(!a.length) return 0; return a[Math.min(a.length-1,Math.floor(q*(a.length-1)))]; }
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;

// ------------------------------------------------------------ metrics
function metricDefs(){
  const m = [{k:"reg", label:"Registered voters (RIK, 23 Oct)", st:i=>S.reg[i], pal:SEQ, f:fmt}];
  m.push({k:"chg_oct", label:"Change 9 → 23 Oct (voters)", st:i=>S.reg[i]-S.reg_a1[i], pal:DIV, f:x=>sgn(x,0), range:[-3,3],
          agg:ids=>ids.reduce((a,i)=>a+S.reg[i]-S.reg_a1[i],0), aggRange:[-30,30]});
  if (D.units23) m.push({k:"ch23", label:"Register change vs. 2023", st:i=>CH23[i], pal:DIV, f:x=>sgn(x*100,1,"%"), range:[-.15,.15], lsgFrom:"u23reg"});
  if (D.units23) m.push({k:"t23", label:"Turnout 2023", st:i=>S.t23[i], pal:SEQ, f:pct, lsgFrom:"u23t"});
  if (D.has_results){
    m.push({k:"turnout", label:"Turnout", st:i=>T[i], pal:SEQ, f:pct, agg:ids=>{let v=0,r=0;ids.forEach(i=>{if(S.voted[i]!=null){v+=S.voted[i];r+=S.reg[i];}});return r?v/r:null;}});
    L.forEach((n,k)=>m.push({k:"sh"+k, label:"Share: "+n, st:i=>SH[k][i], pal:SEQ, f:pct,
      zero:true, agg:ids=>{let v=0,b=0;ids.forEach(i=>{if(VB[i]!=null){v+=S.votes[k][i]||0;b+=VB[i];}});return b?v/b:null;}}));
    m.push({k:"nz", label:"Turnout vs. 8 nearest stations", st:i=>S.nz[i], pal:DIV, f:x=>sgn(x,1," SD"), range:[-4,4], stationsOnly:true});
    if (D.units23) m.push({k:"tch", label:"Turnout change vs. 2023 (points)", st:i=>TCH[i], pal:DIV, f:x=>sgn(x,1," pp"), range:[-15,15],
      agg:ids=>{let v=0,r=0,v3=0,r3=0;ids.forEach(i=>{if(S.voted[i]!=null&&S.t23[i]!=null){v+=S.voted[i];r+=S.reg[i];v3+=S.t23[i]*S.reg23[i];r3+=S.reg23[i];}});return r&&r3?(v/r-v3/r3)*100:null;}});
  }
  m.push({k:"gap", label:"Register gap (earlier analysis)", pal:SEQ, f:x=>pct(x), range:[-.05,.30], lsgOnly:true});
  const first=["turnout"].concat(L.map((_,k)=>"sh"+k)).concat(["nz","tch"]);
  return [...m.filter(x=>first.includes(x.k)).sort((a,b)=>first.indexOf(a.k)-first.indexOf(b.k)), ...m.filter(x=>!first.includes(x.k))];
}
let METRICS = metricDefs();
const TOP3 = L.map((_,k)=>[k,S.votes[k].reduce((a,v)=>a+(v||0),0)]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
function shareOf(k, ids){ let v=0,b=0; ids.forEach(i=>{ if(VB[i]!=null){ v+=S.votes[k][i]||0; b+=VB[i]; } }); return b? v/b : null; }
const EXT_OPTS = () => METRICS.filter(m=>m.k==="reg"||m.k==="turnout"||m.k.startsWith("sh"));
const EXT = () => EXT_OPTS().find(m=>m.k===state.ext) || EXT_OPTS()[0];
function extVal(ids){ const m=EXT(); if(m.k==="reg") return ids.reduce((a,i)=>a+S.reg[i],0); return m.agg(ids); }
const M = () => METRICS.find(m=>m.k===state.metric) || METRICS[0];
const u23ByLsg = {}; (D.units23||[]).forEach(u=>{ if(u.kind==="domestic"&&u.lsg){ const o=(u23ByLsg[u.lsg] ||= {reg23:0,v23:0,reg26:0}); o.reg23+=u.reg23||0; o.v23+=u.v23||0; o.reg26+=u.reg26||0; }});
const gapByLsg = {}; D.gap.forEach(g=>gapByLsg[g.lsg]=g);
function lsgValue(m,name){
  if (m.k==="gap") return gapByLsg[name]?.unexplained_gap_rel ?? null;
  if (m.k==="ch23"){ const o=u23ByLsg[name]; return o&&o.reg23 ? o.reg26/o.reg23-1 : null; }
  if (m.k==="t23"){ const o=u23ByLsg[name]; return o&&o.reg23 ? o.v23/o.reg23 : null; }
  const ids=(idxByLsg[name]||[]).filter(i=>S.kind[i]==="domestic");
  if (m.agg) return m.agg(ids);
  if (m.k==="reg") return ids.reduce((a,i)=>a+S.reg[i],0);
  return null;
}

// ------------------------------------------------------------ map
const TILE = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}";
const VIEWS = {serbia:{longitude:20.85,latitude:44.15,zoom:6.35}, kosovo:{longitude:20.95,latitude:42.8,zoom:7.6}, abroad:{longitude:14,latitude:46,zoom:3.1}};
const deckgl = new deck.Deck({parent:document.getElementById("map"), initialViewState:{...VIEWS.serbia, pitch:0, bearing:0},
  controller:{doubleClickZoom:true}, getTooltip:tooltip, layers:[], onClick:info=>{ if(!info.object) closeCard(); },
  getCursor:({isHovering})=>isHovering?"pointer":"grab"});
function fly(v){ deckgl.setProps({initialViewState:{...v, pitch:0, bearing:0, transitionDuration:700, transitionInterpolator:new deck.FlyToInterpolator()}}); }
const baseLayer = new deck.TileLayer({id:"tiles", data:TILE, minZoom:0, maxZoom:16, tileSize:256,
  renderSubLayers:p=>{ const {west,south,east,north}=p.tile.bbox; return new deck.BitmapLayer(p,{data:null,image:p.data,bounds:[west,south,east,north]}); }});

let stationIdx = [];
function visibleStations(){
  if (state.view==="abroad") return [];
  const out=[]; for(let i=0;i<N;i++){ if(S.lat[i]==null) continue; if(S.kind[i]==="abroad") continue; if(!state.scope[S.kind[i]]) continue; out.push(i);} return out;
}
function range(m, vals){ return m.range || (m.zero ? [0, Math.max(quant(vals,.95),0.005)] : [quant(vals,.05), quant(vals,.95)]); }

function layers(){
  const m = M(), ls=[baseLayer];
  if (state.view==="serbia"){
    const level = m.lsgOnly ? "lsg" : (m.stationsOnly ? "stations" : state.level);
    // Kosovo outline (context)
    ls.push(new deck.GeoJsonLayer({id:"kos", data:D.kos_outline, filled:true, getFillColor:[210,210,205,90], getLineColor:[150,150,150], lineWidthMinPixels:1}));
    if (level==="lsg"){
      const vals={}; D.lsg_geo.features.forEach(f=>vals[f.properties.name]=lsgValue(m,f.properties.name));
      const [lo,hi]= m.k==="chg_oct" ? m.aggRange : range(m,Object.values(vals));
      legend(m.label + " · municipalities", lo, hi, m.pal, m.f);
      ls.push(new deck.GeoJsonLayer({id:"lsg-"+m.k, data:D.lsg_geo, pickable:true, filled:true, stroked:true,
        getFillColor:f=>[...ramp(vals[f.properties.name],lo,hi,m.pal),200], getLineColor:[255,255,255], lineWidthMinPixels:.6,
        updateTriggers:{getFillColor:[m.k,state.party]}, onHover:i=>{}, onClick:i=>{ if(i.object) showLsgCard(i.object.properties.name, vals); }}));
    } else {
      ls.push(new deck.GeoJsonLayer({id:"lsg-lines", data:D.lsg_geo, filled:false, stroked:true, getLineColor:[150,150,150,160], lineWidthMinPixels:.5}));
      stationIdx = visibleStations();
      const vals = stationIdx.map(m.st); const [lo,hi]=range(m,vals);
      legend(m.label + " · polling stations", lo, hi, m.pal, m.f);
      ls.push(new deck.ScatterplotLayer({id:"st-"+m.k, data:stationIdx, pickable:true, opacity:.85, stroked:false,
        getPosition:i=>[S.lon[i],S.lat[i]], getRadius:i=>Math.sqrt(S.reg[i])*9, radiusMinPixels:1.6, radiusMaxPixels:13,
        getFillColor:i=>ramp(m.st(i),lo,hi,m.pal), updateTriggers:{getFillColor:[m.k,JSON.stringify(state.scope)]},
        onClick:i=>{ if(i.object!=null) showCard(i.object); }}));
    }
    if (state.hlLsg.size) ls.push(new deck.GeoJsonLayer({id:"hl-lsg", data:{type:"FeatureCollection",features:D.lsg_geo.features.filter(f=>state.hlLsg.has(f.properties.name))},
      filled:true, getFillColor:[249,115,22,40], getLineColor:[249,115,22], lineWidthMinPixels:2.5}));
  }
  if (state.view==="kosovo") ls.push(...kosovoLayers());
  if (state.view==="abroad") ls.push(...abroadLayers());
  const hl=[...state.hl].filter(i=>S.lat[i]!=null);
  if (state.sel!=null) hl.push(state.sel);
  if (hl.length) ls.push(new deck.ScatterplotLayer({id:"hl", data:hl, getPosition:i=>[S.lon[i],S.lat[i]], filled:false, stroked:true,
    getLineColor:i=>i===state.sel?[22,32,43]:[249,115,22], lineWidthMinPixels:2.2, getRadius:8, radiusUnits:"pixels",
    updateTriggers:{getLineColor:state.sel}}));
  return ls;
}
function render(){ deckgl.setProps({layers:layers()}); }
let hlTimer=null;
function setHL(ids, lsgs){ state.hl=new Set(ids||[]); state.hlLsg=new Set(lsgs||[]); clearTimeout(hlTimer); hlTimer=setTimeout(render,15); }
function clearHL(){ setHL([],[]); }

function tooltip({object, layer}){
  if (object==null || !layer) return null;
  const st={className:"tt", style:{background:"#fff",color:"#16202b",border:"1px solid #e2e5e9",borderRadius:"8px",fontSize:"12px",padding:"7px 9px",boxShadow:"0 3px 10px rgba(0,0,0,.08)",maxWidth:"300px"}};
  if (typeof object==="number"){ const i=object, m=M();
    return {...st, html:`<b>${esc(S.unit[i])} · PS ${S.no[i]}</b><br>${esc(S.name[i])}<br><span style="color:#5d6876">${esc(S.addr[i])}</span><br>Registered: <b>${fmt(S.reg[i])}</b>`+
      (T[i]!=null?`<br>Turnout: <b>${pct(T[i])}</b>`:"")+(m.st&&!["reg","turnout"].includes(m.k)?`<br>${esc(m.label)}: <b>${m.f(m.st(i))}</b>`:"")}; }
  if (object.properties && layer.id.startsWith("lsg-")){ const n=object.properties.name, m=M();
    return {...st, html:`<b>${esc(n)}</b><br>${esc(m.label)}: <b>${m.f(lsgValue(m,n))}</b><br>${(idxByLsg[n]||[]).filter(i=>S.voted[i]!=null).length} of ${(idxByLsg[n]||[]).length} polling stations processed`}; }
  if (layer.id==="kos-mun"){ const p=object.properties, r=kosStats[p.name];
    return {...st, html:`<b>${esc(p.name)}</b><br>`+(r?`Registered: <b>${fmt(r.reg)}</b> at ${r.n} station(s)<br>Votes in: <b>${esc([...r.hosts].join(", "))}</b>`+(r.voted?`<br>Turnout: <b>${pct(r.voted/r.reg)}</b>`:"")+(EXT().k.startsWith("sh")?`<br>${esc(EXT().label)}: <b>${EXT().f(extVal(r.ids))}</b>`:""):(p.not_in_serbian_system?"Not a municipality in Serbia's system":"No voters in the register"))}; }
  if (layer.id==="kos-host"||layer.id==="kos-arcs") return {...st, html:`<b>${esc(object.host||object.name)}</b><br>${fmt(object.reg)} registered voters` + (object.units?`<br>${esc(object.units)}`:"")};
  if (layer.id==="ab-city") return {...st, html:`<b>${esc(object.city)}</b>, ${esc(object.country)}<br>${object.ids.length} station(s), ${fmt(object.reg)} registered`+(object.voted?`<br>Turnout: <b>${pct(object.voted/object.reg)}</b>`:"")+(EXT().k.startsWith("sh")?`<br>${esc(EXT().label)}: <b>${EXT().f(extVal(object.ids))}</b>`:"")};
  return null;
}
function legend(title, lo, hi, pal, f){
  const g = pal.map((c,i)=>`${css(c)} ${i/(pal.length-1)*100}%`).join(",");
  document.getElementById("legend").innerHTML = `<div><b>${esc(title)}</b></div><div class="bar" style="background:linear-gradient(90deg,${g})"></div><div class="lab"><span>${f(lo)}</span><span>${f(hi)}</span></div>`;
}

// ------------------------------------------------------------ station card
function showCard(i){
  state.sel=i; render();
  const rows=[["Registered (RIK 23 Oct)",fmt(S.reg[i])],["Registered (closed register 9 Oct)",fmt(S.reg_a1[i])]];
  if(S.reg23[i]!=null) rows.push(["Registered 2023",fmt(S.reg23[i])]);
  if(T[i]!=null){ rows.push(["Voted",fmt(S.voted[i])],["Turnout",pct(T[i])]); }
  if(S.t23[i]!=null) rows.push(["Turnout 2023",pct(S.t23[i])]);
  if(S.nz[i]!=null) rows.push(["Median turnout of 8 nearest",pct(S.nmed[i])],["Deviation from neighbours",sgn(S.nz[i],1," SD")]);
  L.forEach((n,k)=>{ if(SH[k][i]!=null) rows.push([n, pct(SH[k][i])]); });
  rows.push(["Location precision", PREC[S.prec[i]]||S.prec[i]]);

Object.values(hostPos).forEach(h=>{h.lat/=h.k;h.lon/=h.k;h.units=[...h.units].join(", ");});
function centroid(f){ let best=null,ba=0; for(const poly of f.geometry.coordinates){ const r=poly[0]; let a=0,cx=0,cy=0; for(let j=0;j<r.length-1;j++){const c=r[j][0]*r[j+1][1]-r[j+1][0]*r[j][1];a+=c;cx+=(r[j][0]+r[j+1][0])*c;cy+=(r[j][1]+r[j+1][1])*c;} if(Math.abs(a)>ba){ba=Math.abs(a);best=[cx/(3*a),cy/(3*a)];} } return best; }
const kosCent = {}; D.kos_geo.features.forEach(f=>kosCent[f.properties.name]=centroid(f));

  const labels = D.kos_geo.features.map(f=>({n:f.properties.name, p:kosCent[f.properties.name], v:val(f.properties.name)}));
  return [

      getFillColor:f=>{ const v=val(f.properties.name); return v==null?[255,255,255,230]:[...ramp(v,lo,hi,SEQ),235]; },
      getLineColor:f=>state.hlKos===f.properties.name?[249,115,22]:[255,255,255], getLineWidth:f=>state.hlKos===f.properties.name?3:1, lineWidthUnits:"pixels",

    new deck.ArcLayer({id:"kos-arcs", data:arcs, pickable:true, getSourcePosition:d=>d.from, getTargetPosition:d=>d.to,
      getWidth:d=>Math.max(1,Math.sqrt(d.reg)/24), getSourceColor:d=>state.hlKos&&state.hlKos!==d.unit?[180,180,180,50]:[31,95,153,150],
      getTargetColor:d=>state.hlKos&&state.hlKos!==d.unit?[180,180,180,50]:[194,65,12,170], getHeight:.35, greatCircle:false, updateTriggers:{getSourceColor:state.hlKos,getTargetColor:state.hlKos}}),
    new deck.ScatterplotLayer({id:"kos-host", data:Object.values(hostPos), pickable:true, getPosition:d=>[d.lon,d.lat], getRadius:7, radiusUnits:"pixels",
      getFillColor:[194,65,12], stroked:true, getLineColor:[255,255,255], lineWidthMinPixels:2}),
    new deck.TextLayer({id:"kos-host-l", data:Object.values(hostPos), getPosition:d=>[d.lon,d.lat], getText:d=>`${d.name}\n${fmt(d.reg)}`, getSize:13, getPixelOffset:[0,-22],
      fontWeight:700, getColor:[150,50,10], fontSettings:{sdf:false, fontSize:96, buffer:6}, characterSet:"auto", fontFamily:"Segoe UI, Helvetica Neue, Arial, sans-serif", background:true, backgroundPadding:[3,1,3,1], getBackgroundColor:[255,255,255,215]}),
    new deck.TextLayer({id:"kos-lab", data:labels.filter(d=>d.p), getPosition:d=>d.p, getText:d=>d.v==null?d.n:`${d.n}\n${em.f(d.v)}`, getSize:10.5, fontWeight:600,

  ];
}

// ---------------- Forensics
function tabForensics(c){
  if (!D.has_results){ c.innerHTML = `<h2>Statistical checks of polling-station results</h2>${NOTE}<p style="margin-top:12px">No results loaded yet. Add RIK files to <code>data/results/</code>. The map and the Register, Kosovo and Abroad tabs already work with the register.</p>`; return; }
  const R=[]; for(let i=0;i<N;i++) if(T[i]!=null && inScope(i)) R.push(i);
  const regR=R.reduce((a,i)=>a+S.reg[i],0), votR=R.reduce((a,i)=>a+S.voted[i],0);
  const ip=D.integer;
  let h=`<h2>Statistical checks of polling-station results</h2>${NOTE}${scopeBox()}
  <div class="kpis"><div class="kpi"><b>${fmt(R.length)}</b><span>stations processed (of ${fmt(N)} in scope: ${fmt([...Array(N).keys()].filter(inScope).length)})</span></div><div class="kpi"><b>${pct(votR/regR)}</b><span>turnout, reported stations</span></div><div class="kpi"><b>${D.moran!=null?D.moran.toFixed(2):"n/a"}</b><span>Moran's I of turnout</span></div></div>
  <p class="muted">Hover over a chart or table row to see the stations on the map. Click a station to zoom to it.</p>

  <h3>4. Turnout and the size of the station</h3><div id="size" class="chart"></div><div id="sizeTxt"></div>
  <h3>5. Stations compared with their neighbours</h3><div id="nb"></div>
  <h3>6. Change since the 2023 parliamentary election</h3><div id="c23"></div>`;
  c.innerHTML=h; bindScope();
  // 1
  const cons=(D.consistency||[]).map(([id,chk])=>({i:idIndex[id],chk})).filter(r=>inScope(r.i));
  document.getElementById("cons").innerHTML = cons.length ? `<p>${cons.length} station-level flags.</p>`+table([["Check",r=>esc(r.chk)],["Municipality",r=>esc(S.unit[r.i])],["Station",r=>S.no[r.i],1],["Name",r=>esc(S.name[r.i])],["Registered",r=>fmt(S.reg[r.i]),1],["Voted",r=>fmt(S.voted[r.i]),1],["Turnout",r=>pct(T[r.i]),1,r=>T[r.i]],["Minutes",r=>S.min26[r.i]?`<a href="${esc(S.min26[r.i])}" target="_blank" onclick="event.stopPropagation()">PDF</a>`:""]], cons, {ids:r=>[r.i], go:r=>r.i})
    : `<p>No station fails the arithmetic checks that the loaded columns allow (voters vs. registered; valid + invalid vs. ballots in the box; list votes vs. valid ballots; ballots received minus unused vs. voters).</p>`;
  document.getElementById("cons").insertAdjacentHTML("beforeend", src("results","register"));
  // 2 histogram with 0.5-point bins
  const bins={}; R.forEach(i=>{ const b=Math.floor(T[i]*200)/2; (bins[b] ||= {reg:0,ids:[]}); bins[b].reg+=S.reg[i]; bins[b].ids.push(i); });

  bindHover(hd, p=>({ids:bins[bx[p.pointIndex]].ids}));
  if (ip){ const a=ip["1"], b=ip["5"], out=a.observed>a.hi||b.observed>b.hi;

      (out?`The observed count is <b>above</b> the expected range. This pattern has been associated with results being written to a target rather than counted (Kobak et al. 2016), so the individual stations are worth checking.`:`The observed counts are <b>within</b> the range expected from random variation.`)+
      ` <a href="#" id="intShow">Show these stations on the map</a></p><div class="cap">Expected range from 2,000 simulations in which each station's count varies binomially around its own turnout (Kobak, Shpilkin & Pshenichnikov 2016). Hover a bar to see its stations.</div>`;

  }
  // 3 fingerprint
  const drawFP=()=>{ const k=state.party, n=100, z=Array.from({length:n},()=>new Array(n).fill(0)), mem={};
    let sx=0,sy=0,sxx=0,syy=0,sxy=0,m=0,hh=[];

    bindHover(fd, p=>({ids:mem[Math.floor(p.y)*1000+Math.floor(p.x)]||[]}));

    const out=[]; for(let i=0;i<N&&out.length<400;i++){ if(u&&S.unit[i]!==u) continue; if(q&&!(S.name[i].toLowerCase().includes(q)||S.addr[i].toLowerCase().includes(q))) continue; out.push(i); }
    document.getElementById("fr").innerHTML=`<p class="muted">${out.length>=400?"First 400 matches":out.length+" stations"}. Click to zoom.</p>`+
      table([["Municipality",i=>esc(S.unit[i]),0,i=>S.unit[i]],["Station",i=>S.no[i],1,i=>S.no[i]],["Name",i=>esc(S.name[i])],["Address",i=>esc(S.addr[i])],["Registered",i=>fmt(S.reg[i]),1,i=>S.reg[i]],["Turnout",i=>pct(T[i]),1,i=>T[i]],["Location",i=>`<span class="pill">${PREC[S.prec[i]]||""}</span>`]],out,{ids:i=>[i],go:i=>i,h:Math.max(260, window.innerHeight-230)})+src("register","geocode"); };
  document.getElementById("fu").onchange=run; document.getElementById("fq").oninput=()=>{clearTimeout(window._q);window._q=setTimeout(run,200);}; run();
}

toolbar(); setTab("forensics");
</script>
